spring.application.name=AloTraWebsite

# ===================================================================
# CẤU HÌNH SERVER
# ===================================================================
# Đặt đường dẫn gốc cho ứng dụng. 
# Ví dụ: http://localhost:8080/alotra-website
server.servlet.context-path=/alotra
server.port=8080

# ===================================================================
# CẤU HÌNH KẾT NỐI DATABASE (MYSQL)
# ===================================================================
	spring.datasource.url=jdbc:mysql://localhost:3306/Website_BanTraSua?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
	spring.datasource.username=root
	spring.datasource.password=
	spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CẤU HÌNH JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Force UTF-8 for web layer and templates
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed

