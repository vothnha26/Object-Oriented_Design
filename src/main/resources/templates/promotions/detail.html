<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default_layout :: body(~{::content}, null, null)}">
<head>
    <title th:replace="~{layouts/default_layout :: title(pageTitle=${pageTitle})}"></title>
</head>
<body>
<th:block th:fragment="content">
    <section class="container my-4">
        <div class="row g-4">
            <div class="col-12">
                <div class="card shadow-sm overflow-hidden" style="border-radius:12px;">
                    <img th:src="${item.imageUrl != null ? item.imageUrl : '/images/placeholder.png'}" th:alt="${item.name}"
                         style="width:100%;aspect-ratio:21/9;object-fit:cover;"/>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center text-muted small">
                            <div><i class="far fa-calendar me-1"></i><span th:text="${period}">--</span></div>
                            <div th:if="${item.minOrderAmount > 0}">
                                <i class="fas fa-shopping-cart me-1"></i>
                                Đơn từ: <span class="fw-bold text-success" th:text="${#numbers.formatDecimal(item.minOrderAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                            </div>
                        </div>
                        <h1 class="h4 mt-2" th:text="${item.name}">Tiêu đề sự kiện</h1>
                        <div class="mb-3">
                            <span class="badge bg-danger p-2" th:if="${item.discountRate > 0}" th:text="'Giảm ' + ${item.discountRate} + '%'"></span>
                            <span class="badge bg-danger p-2" th:if="${item.discountValue > 0}" th:text="'Giảm ' + ${#numbers.formatDecimal(item.discountValue, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                        </div>
                        <p class="text-muted" th:if="${item.description}" th:text="${item.description}">Mô tả</p>
                        <div class="d-flex gap-2 mt-4">
                            <a th:href="@{/products}" class="btn btn-success rounded-pill px-4">Đặt ngay</a>
                            <a th:href="@{/promotions}" class="btn btn-outline-secondary rounded-pill px-4">Xem khuyến mãi khác</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>
