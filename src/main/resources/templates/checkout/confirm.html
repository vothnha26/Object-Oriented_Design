<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default_layout :: body(~{::content}, null, ~{::scripts})}">
<head>
    <title th:replace="~{layouts/default_layout :: title(pageTitle='Xác nhận đặt hàng')}"></title>
</head>
<body>
<th:block th:fragment="content">
    <div class="container my-4">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/cart}" class="btn btn-link text-dark p-0 me-3"><i class="fas fa-arrow-left fa-lg"></i></a>
            <h3 class="mb-0 fw-bold">Xác nhận đặt hàng</h3>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row g-4">
            <!-- Cột trái: Danh sách sản phẩm -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold"><i class="fas fa-list-ul me-2 text-success"></i>Sản phẩm đã chọn</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Sản phẩm</th>
                                    <th class="text-center">Số lượng</th>
                                    <th class="text-end pe-4">Thành tiền</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="it : ${items}">
                                    <td class="ps-4 py-3">
                                        <div class="fw-bold text-dark" th:text="${it.variant.product.name}">Tên SP</div>
                                        <div class="small text-muted">
                                            Size: <span th:text="${it.variant.size.name}">M</span>
                                            <span th:if="${!#lists.isEmpty(it.toppings)}" class="ms-2">
                                                + Topping: <span th:each="ot, iter : ${it.toppings}" 
                                                                 th:text="${ot.topping.name} + (${iter.last} ? '' : ', ')"></span>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-center" th:text="${it.quantity}">1</td>
                                    <td class="text-end pe-4 fw-bold" th:text="${#numbers.formatDecimal(it.lineTotalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Thông tin nhận hàng & Thanh toán -->
            <div class="col-lg-4">
                <form th:action="@{/checkout/place}" method="post" id="orderForm">
                    <input type="hidden" name="promoCode" th:value="${promoCode}">
                    
                    <!-- Thông tin người nhận -->
                    <div class="card shadow-sm border-0 rounded-4 mb-4">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">THÔNG TIN NHẬN HÀNG</h6>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Họ tên người nhận</label>
                                <input class="form-control bg-light border-0" name="shipName" th:value="${defaultShipName}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Số điện thoại</label>
                                <input class="form-control bg-light border-0" name="shipPhone" th:value="${defaultShipPhone}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted d-block">PHƯƠNG THỨC NHẬN</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="receivingMethod" id="recvShip" value="DELIVERY" checked onchange="toggleAddr(true)">
                                    <label class="form-check-label" for="recvShip">Giao hàng</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="receivingMethod" id="recvPickup" value="PICKUP" onchange="toggleAddr(false)">
                                    <label class="form-check-label" for="recvPickup">Tại quán</label>
                                </div>
                            </div>

                            <!-- Nhóm Combobox địa chỉ -->
                            <div id="addressSection">
                                <div th:if="${not #lists.isEmpty(addresses)}" class="mb-3">
                                    <label class="form-label small fw-bold text-success">Chọn từ địa chỉ đã lưu</label>
                                    <select class="form-select border-success" id="savedAddress" onchange="fillSavedAddress(this)">
                                        <option value="">-- Nhập địa chỉ mới --</option>
                                        <option th:each="addr : ${addresses}" 
                                                th:value="${addr.addressLine}" 
                                                th:text="${addr.addressLine}"></option>
                                    </select>
                                </div>

                                <div class="mb-2">
                                    <label class="form-label small">Tỉnh / Thành phố</label>
                                    <select class="form-select bg-light border-0" name="province" id="province" required>
                                        <option value="">Chọn Tỉnh/Thành</option>
                                        <option th:each="p : ${provinces}" th:value="${p}" th:text="${p}"></option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Quận / Huyện</label>
                                    <select class="form-select bg-light border-0" name="district" id="district" required disabled>
                                        <option value="">Chọn Quận/Huyện</option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Phường / Xã</label>
                                    <input class="form-control bg-light border-0" name="ward" id="ward" placeholder="Nhập Phường/Xã" required>
                                </div>
                                <div class="mb-0">
                                    <label class="form-label small">Số nhà, tên đường</label>
                                    <input class="form-control bg-light border-0" name="street" id="street" placeholder="Ví dụ: 123 Đường ABC" required>
                                </div>
                            </div>
                            <div id="pickupInfo" style="display:none" class="p-3 bg-light rounded text-muted small">
                                <i class="fas fa-store me-2"></i>Nhận tại: Khu phố 6, P. Linh Trung, TP. Thủ Đức, TP. HCM
                            </div>
                        </div>
                    </div>

                    <!-- Tóm tắt thanh toán -->
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">THANH TOÁN</h6>
                            
                            <div class="mb-3">
                                <select class="form-select border-success text-success fw-bold" name="paymentMethod">
                                    <option value="CASH">Tiền mặt (COD)</option>
                                    <option value="BANK_TRANSFER">Chuyển khoản Ngân hàng</option>
                                    <option value="MOMO">Ví MoMo</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Tạm tính</span>
                                <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </div>
                            <div th:if="${discountAmount != null and discountAmount > 0}" class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Khuyến mãi</span>
                                <span class="text-danger fw-bold" th:text="'-' + ${#numbers.formatDecimal(discountAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Phí giao hàng</span>
                                <span class="text-success small">Miễn phí</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fw-bold">Tổng cộng</span>
                                <span class="h5 fw-bold text-success" th:text="${#numbers.formatDecimal(finalTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </div>

                            <button class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow-sm" type="submit">
                                HOÀN TẤT ĐẶT HÀNG
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const districtData = /*[[${districts}]]*/ {};
        const provinceSelect = document.getElementById('province');
        const districtSelect = document.getElementById('district');

        if (provinceSelect) {
            provinceSelect.addEventListener('change', function() {
                const province = this.value;
                console.log("Selected Province:", province);
                districtSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
                
                if (province && districtData[province]) {
                    districtSelect.disabled = false;
                    districtData[province].forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d;
                        districtSelect.appendChild(opt);
                    });
                } else {
                    districtSelect.disabled = true;
                }
            });
        }

        function toggleAddr(isShip) {
            document.getElementById('addressSection').style.display = isShip ? 'block' : 'none';
            document.getElementById('pickupInfo').style.display = isShip ? 'none' : 'block';
            
            const inputs = document.getElementById('addressSection').querySelectorAll('input, select');
            inputs.forEach(el => el.required = isShip);
        }

        function fillSavedAddress(select) {
            const option = select.options[select.selectedIndex];
            if (!option.value) {
                // Reset form if "New Address" is selected
                document.getElementById('province').value = "";
                document.getElementById('district').innerHTML = '<option value="">Chọn Quận/Huyện</option>';
                document.getElementById('district').disabled = true;
                document.getElementById('ward').value = "";
                document.getElementById('street').value = "";
                return;
            }

            const province = option.getAttribute('data-province');
            const district = option.getAttribute('data-district');
            const ward = option.getAttribute('data-ward');
            const street = option.getAttribute('data-street');

            // Fill Province
            document.getElementById('province').value = province;
            
            // Trigger province change to load districts
            const event = new Event('change');
            document.getElementById('province').dispatchEvent(event);

            // Fill District
            setTimeout(() => {
                document.getElementById('district').value = district;
                document.getElementById('ward').value = ward;
                document.getElementById('street').value = street;
            }, 100);
        }
        /*]]>*/
    </script>
</th:block>
</body>
</html>
