<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/vendor-layout :: layout(pageTitle=${item.id == null ? 'Tạo khuyến mãi mới' : 'Chỉnh sửa khuyến mãi'}, pageContent=~{::pageContent})}">
<body>
<div class="page-content" th:fragment="pageContent">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 fw-bold text-success" th:text="${item.id == null ? 'Tạo mã giảm giá mới' : 'Cập nhật mã giảm giá'}"></h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/vendor/promotions/save}" th:object="${item}" method="post" class="row g-4" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="imageUrl" th:value="${item.imageUrl}">
                
                <div class="col-md-8">
                    <label class="form-label fw-bold">Tên chương trình</label>
                    <input class="form-control" th:field="*{name}" placeholder="Ví dụ: Giảm giá ngày khai trương" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Mã giảm giá (Promo Code)</label>
                    <input class="form-control text-uppercase fw-bold" th:field="*{code}" placeholder="ALOTRANEW" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Loại hình giảm giá</label>
                    <select class="form-select" th:field="*{type}" id="promoType">
                        <option value="PERCENTAGE">Giảm theo phần trăm (%)</option>
                        <option value="VALUE">Giảm số tiền cố định (VND)</option>
                    </select>
                </div>

                <div class="col-md-4" id="divRate">
                    <label class="form-label fw-bold">Mức giảm (%)</label>
                    <div class="input-group">
                        <input type="number" class="form-control" th:field="*{discountRate}" min="0" max="100">
                        <span class="input-group-text">%</span>
                    </div>
                </div>

                <div class="col-md-4" id="divValue" style="display:none">
                    <label class="form-label fw-bold">Số tiền giảm (VND)</label>
                    <div class="input-group">
                        <input type="number" class="form-control" th:field="*{discountValue}" min="0" step="1000">
                        <span class="input-group-text">₫</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Đơn hàng tối thiểu</label>
                    <div class="input-group">
                        <input type="number" class="form-control" th:field="*{minOrderAmount}" min="0" step="1000">
                        <span class="input-group-text">₫</span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold">Ngày bắt đầu</label>
                    <input type="date" class="form-control" th:name="startDate" 
                           th:value="${item.startDate != null ? #temporals.format(item.startDate, 'yyyy-MM-dd') : ''}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Ngày kết thúc</label>
                    <input type="date" class="form-control" th:name="endDate" 
                           th:value="${item.endDate != null ? #temporals.format(item.endDate, 'yyyy-MM-dd') : ''}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Trạng thái chương trình</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Kích hoạt - Hiển thị ngay</option>
                        <option value="INACTIVE">Tạm ngưng - Lưu nháp</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Mô tả ngắn</label>
                    <textarea class="form-control" th:field="*{description}" rows="2" placeholder="Hiển thị cho khách hàng biết về điều kiện khuyến mãi..."></textarea>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Hình ảnh quảng bá</label>
                    <div class="d-flex align-items-center gap-4 p-3 bg-light rounded">
                        <img id="previewImg" th:src="${item.imageUrl != null ? item.imageUrl : '/images/placeholder.png'}" 
                             alt="Preview" style="width: 200px; height: 112px; object-fit: cover; border-radius: 8px;" class="shadow-sm">
                        <div class="flex-grow-1">
                            <input type="file" class="form-control" id="imageInput" name="imageFile" accept="image/*">
                            <div class="form-text mt-2 text-muted">Chọn ảnh kích thước 16:9 để có hiển thị tốt nhất.</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 border-top pt-4 mt-4 d-flex gap-3">
                    <button class="btn btn-success px-5 fw-bold" type="submit">Lưu chương trình</button>
                    <a th:href="@{/vendor/promotions}" class="btn btn-outline-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script>
        const promoType = document.getElementById('promoType');
        const divRate = document.getElementById('divRate');
        const divValue = document.getElementById('divValue');

        function updateFields() {
            if (promoType.value === 'PERCENTAGE') {
                divRate.style.display = 'block';
                divValue.style.display = 'none';
            } else {
                divRate.style.display = 'none';
                divValue.style.display = 'block';
            }
        }

        promoType.addEventListener('change', updateFields);
        window.addEventListener('load', updateFields);

        const imageInput = document.getElementById('imageInput');
        const previewImg = document.getElementById('previewImg');

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</th:block>
</body>
</html>
