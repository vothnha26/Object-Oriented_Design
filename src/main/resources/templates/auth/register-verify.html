<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default_layout :: body(~{::content}, null, null)}">
<head>
    <title th:text="${pageTitle}">Xác thực tài khoản</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 text-center">
                            <h3 class="mb-3">Xác thực tài khoản</h3>
                            <p class="text-muted small mb-4">
                                Một mã xác thực đã được gửi tới email <strong th:text="${email}"></strong>. 
                                Vui lòng nhập mã để hoàn tất đăng ký.
                            </p>

                            <div th:if="${error}" class="alert alert-danger mb-4" th:text="${error}"></div>

                            <form th:action="@{/register/verify}" method="post">
                                <div class="mb-4">
                                    <label for="otp" class="form-label d-none">Mã OTP</label>
                                    <input type="text" class="form-control form-control-lg text-center fw-bold" 
                                           id="otp" name="otp" placeholder="Enter 6-digit OTP" 
                                           maxlength="6" required autofocus
                                           style="letter-spacing: 0.5rem; font-size: 1.5rem;">
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mb-3">
                                    XÁC NHẬN
                                </button>
                                <p class="small text-muted">
                                    Không nhận được mã? <a th:href="@{/register}" class="text-decoration-none">Gửi lại yêu cầu</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
