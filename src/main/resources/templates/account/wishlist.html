<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default_layout :: body(~{::content}, null, ~{::additionalJs})}">
<head>
    <title th:text="${pageTitle}">Danh sách yêu thích</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="container my-5">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/account/profile}">Tài khoản</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Danh sách yêu thích</li>
                </ol>
            </nav>

            <h2 class="mb-4">
                <i class="fas fa-heart text-danger me-2"></i>
                Sản phẩm bạn yêu thích
            </h2>

            <div th:if="${#lists.isEmpty(wishlist)}" class="text-center py-5 shadow-sm rounded bg-white">
                <div class="mb-3">
                    <i class="fas fa-heart-broken fa-4x text-muted"></i>
                </div>
                <h4>Danh sách của bạn đang trống</h4>
                <p class="text-muted">Hãy khám phá menu và lưu lại những món bạn thích nhé!</p>
                <a th:href="@{/products}" class="btn btn-primary rounded-pill px-4 mt-2">
                    <i class="fas fa-shopping-bag me-2"></i>Khám phá ngay
                </a>
            </div>

            <div th:if="${!#lists.isEmpty(wishlist)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <div th:each="item : ${wishlist}" class="col">
                    <div class="card h-100 product-card shadow-sm border-0">
                        <div class="position-relative">
                            <a th:href="@{'/products/' + ${item.product.id}}">
                                <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : '/images/placeholder.png'}" 
                                     class="card-img-top" th:alt="${item.product.name}"
                                     style="height: 200px; object-fit: cover;">
                            </a>
                            <button class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
                                    th:onclick="'removeFromWishlist(' + ${item.product.id} + ', this)'"
                                    title="Xóa khỏi danh sách">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-truncate">
                                <a th:href="@{'/products/' + ${item.product.id}}" 
                                   class="text-decoration-none text-dark" th:text="${item.product.name}">Tên SP</a>
                            </h5>
                            <p class="card-text text-muted small mt-auto">
                                <i class="far fa-clock me-1"></i>
                                Đã thêm: <span th:text="${#temporals.format(item.addedAt, 'dd/MM/yyyy')}">--/--/----</span>
                            </p>
                            <a th:href="@{'/products/' + ${item.product.id}}" class="btn btn-outline-primary btn-sm mt-2 rounded-pill">
                                Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="additionalJs">
        <script>
            function removeFromWishlist(productId, btn) {
                if (confirm('Bạn có chắc muốn xóa sản phẩm này khỏi danh sách yêu thích?')) {
                    const card = btn.closest('.col');
                    $.post('/account/wishlist/remove', { productId: productId })
                        .done(function() {
                            card.fadeOut(300, function() {
                                $(this).remove();
                                if ($('.product-card').length === 0) {
                                    location.reload(); // Hiển thị trạng thái trống
                                }
                            });
                        })
                        .fail(function() {
                            alert('Có lỗi xảy ra, vui lòng thử lại sau.');
                        });
                }
            }
        </script>
    </th:block>
</body>
</html>
