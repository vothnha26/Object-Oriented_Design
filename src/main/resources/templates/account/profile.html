<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/account-layout :: layout(pageTitle='Thông Tin Tài Khoản', pageContent=~{::pageContent})}">
<head>
    <title>Thông Tin Tài Khoản</title>
</head>
<body>
<div class="page-content" th:fragment="pageContent" th:with="currentPage='account-profile'">
    <h2 class="mb-4">Tài khoản của tôi</h2>
    <div class="row">
        <!-- Sidebar nav moved to layout -->
        <!-- Content area -->
        <div class="col-md-12 col-lg-10 col-xl-9">
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-3">Thông tin cá nhân</h5>
                    <form th:action="@{/account/profile/update}" th:object="${form}" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ tên</label>
                            <input class="form-control" th:field="*{fullName}" required />
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required />
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input class="form-control" th:field="*{phone}" />
                            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-12"><hr /></div>
                        <div class="col-md-6">
                            <label class="form-label">Mật khẩu mới (nếu muốn đổi)</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" />
                            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-success" type="submit">Lưu thay đổi</button>
                        </div>
                    </form>
                    <div class="mt-4 small text-muted">
                        <div><strong>Tài khoản:</strong> <span th:text="${customer.username}"></span></div>
                        <div><strong>Trạng thái:</strong>
                            <span class="badge" th:text="${customer.status.name() == 'ACTIVE' ? 'Hoạt động' : 'Khóa'}"
                                  th:classappend="${customer.status.name() == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quản lý địa chỉ -->
            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Sổ địa chỉ</h5>
                    
                    <div th:if="${#lists.isEmpty(addresses)}" class="text-muted small mb-3">
                        Bạn chưa có địa chỉ lưu sẵn.
                    </div>
                    
                    <ul class="list-group list-group-flush mb-4" th:if="${not #lists.isEmpty(addresses)}">
                        <li class="list-group-item d-flex justify-content-between align-items-start px-0" th:each="addr : ${addresses}">
                            <div class="ms-2 me-auto">
                                <div class="fw-bold">
                                    <span th:text="${addr.label}"></span>
                                    <span th:if="${addr.isDefault}" class="badge bg-success ms-1" style="font-size: 0.7rem;">Mặc định</span>
                                </div>
                                <span class="small text-muted" th:text="${addr.addressLine}"></span>
                            </div>
                            <form th:action="@{'/account/addresses/delete/' + ${addr.id}}" method="post">
                                <button type="submit" class="btn btn-sm btn-link text-danger" onclick="return confirm('Xóa địa chỉ này?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </li>
                    </ul>

                    <h6 class="fw-bold small mb-2">Thêm địa chỉ mới</h6>
                    <form th:action="@{/account/addresses/add}" method="post" class="row g-2">
                        <div class="col-md-4">
                            <input class="form-control form-control-sm" name="label" placeholder="Tên gợi nhớ (VD: Nhà riêng)" required />
                        </div>
                        <div class="col-md-6">
                            <input class="form-control form-control-sm" name="addressLine" placeholder="Địa chỉ chi tiết" required />
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-sm btn-primary w-100" type="submit">Thêm</button>
                        </div>
                        <div class="col-12 mt-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="isDefault" id="isDefault">
                                <label class="form-check-label small" for="isDefault">Đặt làm mặc định</label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
