<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default_layout :: body(~{::content}, null, ~{::additionalJs})}">
<head>
    <title th:replace="~{layouts/default_layout :: title(pageTitle='Giỏ Hàng')}"></title>
</head>
<body>
<th:block th:fragment="content">
    <div class="container my-5">
        <h2 class="mb-4"><i class="fas fa-shopping-cart me-2"></i>Giỏ hàng của bạn</h2>

        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5 shadow-sm rounded bg-white">
            <div class="mb-3">
                <i class="fas fa-cart-plus fa-4x text-muted"></i>
            </div>
            <h4>Giỏ hàng của bạn đang trống</h4>
            <p class="text-muted">Hãy chọn cho mình những ly trà sữa thơm ngon nhất nhé!</p>
            <a th:href="@{/products}" class="btn btn-success rounded-pill px-4 mt-2">
                Quay lại menu
            </a>
        </div>

        <div th:if="${!#lists.isEmpty(cartItems)}" class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">Sản phẩm</th>
                                        <th class="text-center">Số lượng</th>
                                        <th class="text-end pe-4">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${cartItems}">
                                        <td class="ps-4 py-3">
                                            <div class="d-flex align-items-center">
                                                <img th:src="${item.imageUrl != null ? item.imageUrl : '/images/placeholder.png'}" 
                                                     class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                                                <div class="ms-3">
                                                    <h6 class="mb-0" th:text="${item.productName}">Tên sản phẩm</h6>
                                                    <small class="text-muted" th:text="'Size: ' + ${item.sizeName}">Size M</small>
                                                    <div class="mt-1" th:if="${!#lists.isEmpty(item.toppings)}">
                                                        <span th:each="t : ${item.toppings}" 
                                                              class="badge bg-light text-dark border me-1 small fw-normal"
                                                              th:text="${t.name}">Topping</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <div class="d-inline-flex align-items-center bg-light rounded-pill px-2 py-1">
                                                <span class="px-3 fw-bold" th:text="${item.quantity}">1</span>
                                            </div>
                                        </td>
                                        <td class="text-end pe-4">
                                            <div class="fw-bold" th:text="${#numbers.formatDecimal(item.total, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                                            <small class="text-muted" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫ / ly'"></small>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a th:href="@{/products}" class="btn btn-outline-secondary rounded-pill">
                        <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
                    </a>
                    <form th:action="@{/api/cart/clear}" method="post">
                        <button type="submit" class="btn btn-link text-danger text-decoration-none" onclick="return confirm('Xóa toàn bộ giỏ hàng?')">
                            <i class="fas fa-trash-alt me-2"></i>Xóa giỏ hàng
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 sticky-top" style="top: 2rem;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Tổng cộng</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Tạm tính</span>
                            <span class="fw-bold" th:text="${#numbers.formatDecimal(subTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Phí vận chuyển</span>
                            <span class="text-success fw-bold">Miễn phí</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="h5">Tổng tiền</span>
                            <span class="h5 text-success fw-bold" th:text="${#numbers.formatDecimal(subTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                        </div>
                        <a th:href="@{/checkout}" class="btn btn-success btn-lg w-100 rounded-pill py-3 fw-bold">
                            TIẾN HÀNH ĐẶT HÀNG
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="additionalJs">
</th:block>
</body>
</html>
