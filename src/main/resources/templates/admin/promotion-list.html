<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(pageTitle='Quản lý Khuyến mãi', pageContent=~{::pageContent})}">
<body>
<div class="page-content" th:fragment="pageContent">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Danh sách chương trình khuyến mãi</h5>
            <a th:href="@{/admin/promotions/new}" class="btn btn-primary px-4"><i class="fa fa-plus me-2"></i>Thêm mã mới</a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Mã ưu đãi</th>
                        <th>Tên chương trình</th>
                        <th>Mức giảm</th>
                        <th>Thời gian</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${items}">
                        <td class="ps-4">
                            <code class="fw-bold text-primary px-2 py-1 bg-light rounded" th:text="${p.code}">CODE</code>
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${p.name}">Tên sự kiện</div>
                            <div class="small text-muted text-truncate" style="max-width: 200px;" th:text="${p.description}">Mô tả</div>
                        </td>
                        <td>
                            <th:block th:if="${p.detail instanceof T(com.alotra.entity.PercentagePromotionDetail)}">
                                <span class="badge bg-info text-dark" th:text="${p.detail.discountRate + '%'}">10%</span>
                            </th:block>
                            <th:block th:if="${p.detail instanceof T(com.alotra.entity.ValuePromotionDetail)}">
                                <span class="badge bg-info text-dark" th:text="${#numbers.formatDecimal(p.detail.discountValue, 0, 'COMMA', 0, 'POINT') + ' ₫'}">20k</span>
                            </th:block>
                        </td>
                        <td class="small">
                            <div th:text="'Bắt đầu: ' + ${#temporals.format(p.startDate, 'dd/MM/yyyy')}"></div>
                            <div th:text="'Kết thúc: ' + ${#temporals.format(p.endDate, 'dd/MM/yyyy')}"></div>
                        </td>
                        <td>
                            <span th:if="${p.isActive()}" class="badge bg-success">Đang chạy</span>
                            <span th:unless="${p.isActive()}" class="badge bg-secondary">Hết hạn/Tạm ngưng</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <a th:href="@{'/admin/promotions/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary" title="Chỉnh sửa">
                                    <i class="fa fa-edit"></i>
                                </a>
                                <a th:href="@{'/admin/promotions/delete/' + ${p.id}}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Bạn có chắc muốn vô hiệu hóa khuyến mãi này?')" title="Xóa">
                                    <i class="fa fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa fa-folder-open fa-3x mb-3 d-block"></i>
                            Chưa có chương trình khuyến mãi nào được tạo.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
